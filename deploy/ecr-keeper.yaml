apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-keeper
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecr-keeper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecr-keeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecr-keeper
subjects:
  - kind: ServiceAccount
    name: ecr-keeper
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecr-keeper
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecr-keeper
  template:
    metadata:
      labels:
        app: ecr-keeper
    spec:
      serviceAccountName: ecr-keeper
      containers:
        - name: ecr-keeper
          image: ecr-keeper:local
          args:
            - --cluster=my-cluster
            - --mode=report
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
